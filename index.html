<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2447E0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Prancheta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Archivo+Black&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E9EDF2; --ink:#111722; --ink2:#5C6979; --line:#DBE1E9;
  --accent:#2447E0; --btn:#2447E0; --btn-h:#1B37B8; --on-btn:#FFFFFF; --accent-soft:#E4E9FC;
  --ok:#0B8F5E; --ok-soft:#DCF3E9; --warn:#B96E00; --warn-soft:#F8ECD9; --bad:#D23B2E; --bad-soft:#FAE3E0;
  --on-ok:#FFFFFF; --on-bad:#FFFFFF;
  --ch1:#2447E0; --ch2:#D97706;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --r:12px; --rs:8px;
  --grid-line:#E4E8EE; --block-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1117; --surface:#151C25; --surface2:#1E2733; --ink:#E9EDF4; --ink2:#8E9CAD; --line:#27313F;
    --accent:#8FA3FF; --btn:#3D5BFF; --btn-h:#5A74FF; --on-btn:#FFFFFF; --accent-soft:#212C4E;
    --ok:#45CE93; --ok-soft:#12352A; --warn:#E8A23D; --warn-soft:#33260F; --bad:#F87168; --bad-soft:#3B1815;
    --on-ok:#07130D; --on-bad:#230605;
    --ch1:#6B84F5; --ch2:#BD7E1F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
    --grid-line:#222C38;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1117; --surface:#151C25; --surface2:#1E2733; --ink:#E9EDF4; --ink2:#8E9CAD; --line:#27313F;
  --accent:#8FA3FF; --btn:#3D5BFF; --btn-h:#5A74FF; --on-btn:#FFFFFF; --accent-soft:#212C4E;
  --ok:#45CE93; --ok-soft:#12352A; --warn:#E8A23D; --warn-soft:#33260F; --bad:#F87168; --bad-soft:#3B1815;
  --on-ok:#07130D; --on-bad:#230605;
  --ch1:#6B84F5; --ch2:#BD7E1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --grid-line:#222C38;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{text-wrap:balance;line-height:1.2}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- brand ---------- */
.logo{display:inline-flex;align-items:center;gap:9px;font-family:"Archivo Black","Archivo",sans-serif;letter-spacing:.02em;font-size:19px;user-select:none}
.logo .mk{width:30px;height:30px;border-radius:8px;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;font-size:17px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mono{font-variant-numeric:tabular-nums}
.big-num{font-family:"Archivo Black","Archivo",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90}
#splash .in{display:grid;justify-items:center;gap:14px}
#splash .mk{width:56px;height:56px;border-radius:14px;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;font-family:"Archivo Black",sans-serif;font-size:30px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#splash .t{font-family:"Archivo Black",sans-serif;font-size:22px;letter-spacing:.02em}
#splash .s{font-size:13px;color:var(--ink2)}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh}
#app.on{display:block}
#sidebar{display:none}
#main{max-width:1060px;margin:0 auto;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px))}
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;align-items:stretch;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
#tabbar button{display:grid;justify-items:center;gap:3px;padding:5px 10px;border-radius:10px;color:var(--ink2);font-size:10.5px;font-weight:600;letter-spacing:.02em;min-width:58px}
#tabbar button svg{width:22px;height:22px}
#tabbar button.on{color:var(--accent)}
@media (min-width: 960px){
  #tabbar{display:none}
  #app.on{display:grid;grid-template-columns:224px 1fr}
  #sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  #sidebar .logo{margin:0 8px 22px}
  #sidebar button.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);text-align:left}
  #sidebar button.nv svg{width:19px;height:19px}
  #sidebar button.nv:hover{background:var(--surface2)}
  #sidebar button.nv.on{background:var(--accent-soft);color:var(--accent)}
  #sidebar .sb-foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--ink2)}
  #main{padding:26px 32px 60px}
}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.sec{margin-top:22px}
.sec > .eyebrow{margin-bottom:9px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hd h1{font-size:24px;font-weight:800;letter-spacing:-.015em}
.hd .sub{color:var(--ink2);font-size:13px;margin-top:2px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tile .v{font-size:26px;line-height:1.15;margin-top:2px}
.tile .l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.tile .d{font-size:11.5px;color:var(--ink2);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--btn-h)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.soft:hover{background:var(--line)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.danger.ghost{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn.danger.ghost:hover{background:var(--bad-soft);border-color:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.sm svg{width:14px;height:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mut{background:var(--surface2);color:var(--ink2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.avatar{border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.s28{width:28px;height:28px;font-size:11px;border-radius:8px}
.avatar.s40{width:40px;height:40px;font-size:15px}
.avatar.s56{width:56px;height:56px;font-size:21px;border-radius:14px}

/* forms */
.f{display:grid;gap:5px;margin-bottom:13px}
.f label{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink2)}
.f input,.f select,.f textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15px;width:100%;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f textarea{resize:vertical;min-height:72px}
.f .hint{font-size:11.5px;color:var(--ink2)}
.f .err{font-size:12px;color:var(--bad);font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.switch{position:relative;width:44px;height:26px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:99px;transition:background .15s}
.switch .th{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked ~ .tr{background:var(--btn);border-color:var(--btn)}
.switch input:checked ~ .th{transform:translateX(18px)}

.checkline{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer;user-select:none}
.checkline input{width:17px;height:17px;accent-color:var(--btn)}

/* lists */
.lst{display:grid;gap:9px}
.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.rowcard:hover{border-color:var(--accent)}
.rowcard .nm{font-weight:700;font-size:15px}
.rowcard .dt{font-size:12.5px;color:var(--ink2);margin-top:1px}

/* today session cards */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}
.sess .tm{font-family:"Archivo Black",sans-serif;font-size:17px;font-variant-numeric:tabular-nums;width:52px;flex:none;line-height:1.1}
.sess .tm .e{display:block;font-family:"Archivo",sans-serif;font-weight:600;font-size:10.5px;color:var(--ink2)}
.sess .who{flex:1;min-width:0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:11px}
.sess .who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .who .g{font-size:11.5px;color:var(--ink2)}
.sess .acts{display:flex;gap:6px;flex:none}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--ink2);flex:none}
.mark svg{width:16px;height:16px}
.mark.ok-on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.mark.miss-on{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.sess.done{border-color:var(--ok)}
.sess.missed{opacity:.75}
.sess.cancelled{opacity:.55;border-style:dashed}
.sess.cancelled .nm{text-decoration:line-through}
.sess .flag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}

/* agenda */
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wknav .ttl{font-weight:800;font-size:15px;flex:1;text-align:center}
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.daychip{display:grid;justify-items:center;gap:1px;padding:7px 2px 6px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.daychip .w{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.daychip .n{font-family:"Archivo Black",sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
.daychip .dots{display:flex;gap:2px;height:5px;margin-top:2px}
.daychip .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.daychip.off{opacity:.45}
.daychip.today .n{color:var(--accent)}
.daychip.sel{background:var(--btn);border-color:var(--btn)}
.daychip.sel .w,.daychip.sel .n{color:var(--on-btn)}
.daychip.sel .dots i{background:var(--on-btn)}

.only-d{display:none}
@media(min-width:960px){.only-d{display:block}.only-m{display:none}}

/* week grid (desktop) */
.wg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
.wg-in{display:grid;min-width:720px}
.wg-head{display:grid;border-bottom:1px solid var(--line)}
.wg-head .gc{padding:10px 8px;text-align:center;border-left:1px solid var(--line)}
.wg-head .gc:first-child{border-left:none}
.wg-head .gc .w{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.wg-head .gc .n{font-family:"Archivo Black",sans-serif;font-size:17px}
.wg-head .gc.today .n{color:var(--accent)}
.wg-body{display:grid;position:relative}
.wg-col{position:relative;border-left:1px solid var(--line);background:
  repeating-linear-gradient(to bottom, var(--grid-line) 0 1px, transparent 1px 66px)}
.wg-col:first-child{border-left:none}
.wg-col.off{background-color:color-mix(in srgb, var(--surface2) 55%, transparent)}
.wg-gutter{position:relative}
.wg-gutter .h{position:absolute;right:7px;transform:translateY(-7px);font-size:10.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;color:var(--block-ink);padding:3px 7px;overflow:hidden;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);text-align:left}
.blk .t{display:block;font-size:10px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.blk .n{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.blk.dim{opacity:.5}
.blk .fl{position:absolute;top:3px;right:5px;font-size:8.5px;font-weight:800;letter-spacing:.04em;opacity:.85}
.blk.cnc{background:transparent!important;border:1.5px dashed var(--ink2);color:var(--ink2);box-shadow:none}
.blk.cnc .n{text-decoration:line-through}

/* students */
.filterbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.search{flex:1;min-width:170px;position:relative}
.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px;font-size:14px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink2)}
.schips{display:flex;flex-wrap:wrap;gap:5px}
.schip{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink2);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}

/* student page */
.stu-head{display:flex;gap:15px;align-items:center;margin-bottom:4px}
.stu-head h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.stu-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.kv .it{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px}
.kv .it .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kv .it .v{font-weight:700;font-size:14px;margin-top:1px}

.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar i.acc{background:var(--btn)}

.marks-strip{display:flex;gap:4px;flex-wrap:wrap}
.mk-dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800}
.mk-dot.ok{background:var(--ok);color:var(--on-ok)}
.mk-dot.miss{background:var(--bad);color:var(--on-bad)}

.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}
.paycell{border:1.5px solid var(--line);border-radius:9px;padding:7px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;background:var(--surface)}
.paycell .m{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.paycell .s{font-size:10px;font-weight:700}
.paycell.pago{background:var(--ok-soft);border-color:var(--ok)}
.paycell.pago .m,.paycell.pago .s{color:var(--ok)}
.paycell.atrasado{background:var(--bad-soft);border-color:var(--bad)}
.paycell.atrasado .m,.paycell.atrasado .s{color:var(--bad)}
.paycell.fut{opacity:.5;cursor:default}

.spark{width:100%;height:64px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:var(--accent);opacity:.1;stroke:none}
.spark circle{fill:var(--accent)}

/* fin */
.finrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}

/* overlay system */
#overlay{position:fixed;inset:0;z-index:60;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:auto;display:grid;place-items:center;padding:16px}
.layer .bk{position:absolute;inset:0;background:rgba(9,13,20,.55);backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:min(86vh,760px);display:flex;flex-direction:column;animation:mup .18s ease}
.modal.wide{max-width:640px}
@keyframes mup{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:center;gap:10px;padding:15px 18px 11px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:16.5px;font-weight:800;flex:1;letter-spacing:-.01em}
.m-body{padding:16px 18px;overflow-y:auto}
.m-foot{display:flex;gap:9px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.layer.sheet{place-items:end center;padding:0}
.layer.sheet .modal{max-width:520px;border-radius:18px 18px 0 0;animation:sup .2s ease;max-height:82vh}
@media(min-width:700px){.layer.sheet{place-items:center;padding:16px}.layer.sheet .modal{border-radius:16px}}
@keyframes sup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

/* ================= storage layer ================= */
function persistLocal(){
  if(!S.cloud||S.syncDead){
    try{localStorage.setItem(KEY,JSON.stringify(S.data))}
    catch(e){
      if(!S._lsErr){S._lsErr=true;toast('Não foi possível salvar neste navegador (armazenamento cheio). Exporte um backup e remova fotos antigas.','bad')}
    }
  }
}
function dbErr(e){
  if(e&&e.code==='quota_exceeded')toast('Limite de armazenamento na nuvem atingido — exclua dados antigos.','bad');
  else toast('Falha ao salvar na nuvem. Verifique a conexão e repita a ação.','bad');
}
/* fire a cloud write with one retry on transient 'unavailable' */
function cloudWrite(fn){
  try{
    fn().catch(e=>{
      if(e&&e.code==='unavailable')setTimeout(()=>{try{fn().catch(dbErr)}catch(e2){dbErr(e2)}},700+Math.floor(Math.random()*600));
      else dbErr(e);
    });
  }catch(e){dbErr(e)}
}
function putDoc(coll,id,body){ S.data[coll][id]=clone(body); persistLocal(); if(S.cloud)cloudWrite(()=>S.db.doc(coll+'/'+id).set(clone(body))); }
function delDoc(coll,id){ delete S.data[coll][id]; persistLocal(); if(S.cloud)cloudWrite(()=>S.db.doc(coll+'/'+id).delete()); }
function putCfg(name,body){ S.data[name]=clone(body); persistLocal(); if(S.cloud)cloudWrite(()=>S.db.doc('config/'+name).set(clone(body))); }
function delCfg(name){ S.data[name]=null; persistLocal(); if(S.cloud)cloudWrite(()=>S.db.doc('config/'+name).delete()); }
/* merge-write for aggregate docs (attendance/payments/exceptions): additions and edits
   merge server-side so two devices editing different keys of the same month/year doc
   don't clobber each other; removals fall back to full set via putDoc */
function mergeDoc(coll,id,patch,fullBody){
  S.data[coll][id]=clone(fullBody); persistLocal();
  if(!S.cloud)return;
  const ref=S.db.doc(coll+'/'+id), p=clone(patch), body=clone(fullBody);
  const trySet=()=>cloudWrite(()=>ref.set(clone(body)));
  try{
    ref.update(p).catch(e=>{
      if(e&&e.code==='invalid_argument')trySet();
      else if(e&&e.code==='unavailable')setTimeout(()=>{ref.update(clone(p)).catch(()=>trySet())},800);
      else dbErr(e);
    });
  }catch(e){trySet()}
}
/* awaited variants for bulk import */
async function putDocAwait(coll,id,body){
  S.data[coll][id]=clone(body);
  if(S.cloud){
    try{await S.db.doc(coll+'/'+id).set(clone(body))}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700));await S.db.doc(coll+'/'+id).set(clone(body))}
      else throw e;
    }
  }
}
async function delDocAwait(coll,id){ delete S.data[coll][id]; if(S.cloud)await S.db.doc(coll+'/'+id).delete(); }

async function hashPw(pw,salt){
  const msg=salt+'|'+pw;
  try{
    if(crypto&&crypto.subtle){
      const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
      return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let a=5381,b=52711; for(let i=0;i<msg.length;i++){const c=msg.charCodeAt(i);a=(a*33+c)>>>0;b=(b*31+c)>>>0}
  return 'x'+a.toString(16)+b.toString(16);
}

}

/* ================= domain ================= */
const students=()=>Object.entries(S.data.students).map(([id,s])=>({id,...s}));
const activeStudents=()=>students().filter(s=>s.active!==false);
const stById=id=>{const s=S.data.students[id];return s?{id,...s}:null};
const sDur=s=>Number(s&&s.dur)||Number(settings().dur)||60;
const ovl=(a,da,b,db2)=>a<b+db2&&b<a+da;

function conflictAt(day,time,dur,exceptSid,draftSched){
  for(const s of activeStudents()){
    if(s.id===exceptSid)continue;
    for(const sc of (s.schedule||[])){
      if(sc.d===day&&ovl(toMin(time),dur,toMin(sc.t),sDur(s)))return{s,sc};
    }
  }
  if(draftSched)for(const sc of draftSched){
    if(sc.d===day&&ovl(toMin(time),dur,toMin(sc.t),dur))return{self:true,sc};
  }
  return null;
}
function allExc(){
  const out=[];
  for(const[docId,doc]of Object.entries(S.data.exceptions))
    for(const[id,it]of Object.entries((doc&&doc.items)||{}))out.push({...it,id,docId});
  return out;
}
function daySessions(iso){
  const wd=dateOf(iso).getDay(), list=[], cancelled=[], exc=allExc();
  for(const s of activeStudents()){
    if(s.start&&s.start>iso)continue;
    for(const sc of (s.schedule||[])){
      if(sc.d!==wd)continue;
      const kill=exc.find(e=>(e.type==='cancel'||e.type==='move')&&e.date===iso&&e.sid===s.id&&e.time===sc.t);
      const item={sid:s.id,time:sc.t,dur:sDur(s),kind:'reg',w:sc.w||''};
      if(kill){ if(kill.type==='cancel')cancelled.push({...item,exc:kill}); }
      else list.push(item);
    }
  }
  for(const e of exc){
    const s=stById(e.sid); if(!s||s.active===false)continue;
    if(e.type==='move'&&e.toDate===iso)list.push({sid:e.sid,time:e.toTime,dur:sDur(s),kind:'moved',exc:e,w:e.w||''});
    if(e.type==='extra'&&e.date===iso)list.push({sid:e.sid,time:e.time,dur:sDur(s),kind:'extra',exc:e,w:e.w||''});
  }
  list.sort((a,b)=>toMin(a.time)-toMin(b.time));
  cancelled.sort((a,b)=>toMin(a.time)-toMin(b.time));
  return{list,cancelled};
}
function conflictOnDate(iso,time,dur,skip){
  for(const it of daySessions(iso).list){
    /* skip only the exact occurrence being moved: same student, time, kind AND date —
       without the date check, moving "Seg 10:00" to the same slot next week would
       silently double-book against the recurring twin on the target date */
    if(skip&&iso===skip.date&&it.sid===skip.sid&&it.time===skip.time&&it.kind===skip.kind)continue;
    if(ovl(toMin(time),dur,toMin(it.time),it.dur))return it;
  }
  return null;
}
/* future date-specific sessions (moved-in / extras) that clash with a recurring weekday slot */
function excConflictsForSlot(day,time,dur,exceptSid){
  const t0=todayISO(), out=[];
  for(const e of allExc()){
    if(e.sid===exceptSid)continue;
    let d2=null,t2=null;
    if(e.type==='extra'){d2=e.date;t2=e.time}
    else if(e.type==='move'){d2=e.toDate;t2=e.toTime}
    else continue;
    if(!d2||!t2||d2<t0)continue;
    if(dateOf(d2).getDay()!==day)continue;
    const s=stById(e.sid); if(!s||s.active===false)continue;
    if(ovl(toMin(time),dur,toMin(t2),sDur(s)))out.push({date:d2,time:t2,s});
  }
  return out;
}
function freeSlots(day,dur,exceptSid,draftSched){
  const cfg=settings().days[day]; if(!cfg||!cfg.on)return[];
  const out=[], step=Number(settings().step)||60;
  for(let m=toMin(cfg.start);m+dur<=toMin(cfg.end);m+=step){
    const c=conflictAt(day,toHM(m),dur,exceptSid,draftSched);
    out.push({t:toHM(m),free:!c,by:c?(c.self?'você':(c.s?c.s.name:'')):null,self:!!(c&&c.self)});
  }
  return out;
}
const attKey=(iso,time)=>iso+'|'+time;
function getMark(sid,iso,time){

  return (doc&&doc.marks&&doc.marks[attKey(iso,time)])||null;
}
function setMark(sid,iso,time,status){
  const id=sid+'_'+ymOf(iso);
  const doc=clone(S.data.attendance[id]||{sid,ym:ymOf(iso),marks:{}});
  doc.marks=doc.marks||{};
  const k=attKey(iso,time);
  if(!status){
    const prev=doc.marks[k]; if(!prev)return;
    /* limpar presença preserva a anotação (entrada sem "s" não conta nas estatísticas) */
    if(prev.note)doc.marks[k]={note:prev.note}; else delete doc.marks[k];
    putDoc('attendance',id,doc);
  }
  else{
    const prev=doc.marks[k]||{};
    const mk={s:status}; if(prev.note)mk.note=prev.note;
    doc.marks[k]=mk;
    mergeDoc('attendance',id,{sid,ym:ymOf(iso),marks:{[k]:clone(mk)}},doc);
  }
}
/* anotação NUNCA cria presença: sem marca existente, salva só a nota (sem "s") */
function setMarkNote(sid,iso,time,note){
  const id=sid+'_'+ymOf(iso);
  const doc=clone(S.data.attendance[id]||{sid,ym:ymOf(iso),marks:{}});
  doc.marks=doc.marks||{};
  const k=attKey(iso,time);
  const prev=doc.marks[k];
  if(!prev&&!note)return;
  const mk={...(prev||{})};
  if(note)mk.note=note; else delete mk.note;
  if(!mk.s&&!mk.note){ delete doc.marks[k]; putDoc('attendance',id,doc); return; }
  doc.marks[k]=mk;
  mergeDoc('attendance',id,{sid,ym:ymOf(iso),marks:{[k]:clone(mk)}},doc);

function streakOf(sid){
  const marks=[];
  for(const[id,doc]of Object.entries(S.data.attendance)){
    if(!id.startsWith(sid+'_')||!doc.marks)continue;
    for(const[k,v]of Object.entries(doc.marks))marks.push({k,s:v.s});
  }
  const rated=marks.filter(m=>m.s==='ok'||m.s==='miss');
  rated.sort((a,b)=>b.k.localeCompare(a.k));
  let n=0;
  for(const m of rated){ if(m.s==='ok')n++; else break; }
  return n;
}
function moveMark(sid,fromIso,fromTime,toIso,toTime){

  const idFrom=sid+'_'+ymOf(fromIso), idTo=sid+'_'+ymOf(toIso);
  const dFrom=clone(S.data.attendance[idFrom]||{sid,ym:ymOf(fromIso),marks:{}});
  dFrom.marks=dFrom.marks||{};
  delete dFrom.marks[attKey(fromIso,fromTime)];
  if(idFrom===idTo){
    dFrom.marks[attKey(toIso,toTime)]={s:m.s};

    dTo.marks=dTo.marks||{}; dTo.marks[attKey(toIso,toTime)]={s:m.s};
    mergeDoc('attendance',idTo,{sid,ym:ymOf(toIso),marks:{[attKey(toIso,toTime)]:{s:m.s}}},dTo);

}

function payDoc(sid,y){return S.data.payments[sid+'_'+y]||{sid,year:y,months:{}}}
function payStatus(sid,y,m){
  const s=stById(sid); if(!s)return{st:'none'};
  const rec=(payDoc(sid,y).months||{})[String(m)];
  if(rec)return{st:'pago',rec};
  if(s.plan==='pacote')return{st:'none'};
  if(!(Number(s.fee)>0))return{st:'none'};
  const startYm=s.start?ymOf(s.start):(s.createdAt?ymOf(s.createdAt):null);
  const thisYm=y+'-'+pad(m);
  if(startYm&&thisYm<startYm)return{st:'fora'};
  const t=new Date(), cy=t.getFullYear(), cm=t.getMonth()+1;
  if(y>cy||(y===cy&&m>cm))return{st:'futuro'};
  const due=Number(s.dueDay)||5;
  if(y<cy||(y===cy&&m<cm)||(y===cy&&m===cm&&t.getDate()>due))return{st:'atrasado'};
  return{st:'pendente'};
}

const LMKEY='prancheta-lastmethod';
const getLM=()=>{try{return localStorage.getItem(LMKEY)||settings().lastMethod||''}catch(e){return ''}};
const setLM=v=>{try{localStorage.setItem(LMKEY,v)}catch(e){}};
function occupancy(){
  const st=settings(); let avail=0;
  for(let d=0;d<7;d++){const c=st.days[d];if(c&&c.on)avail+=Math.max(0,toMin(c.end)-toMin(c.start))}
  let booked=0;
  for(const s of activeStudents())for(const sc of (s.schedule||[]))booked+=sDur(s);
  return{avail,booked,pct:avail?Math.min(100,Math.round(booked/avail*100)):0};
}
function monthRevenue(y,m){

  for(const s of students()){
    const fee=Number(s.fee)||0;
    const rec=(payDoc(s.id,y).months||{})[String(m)];
    if(rec)got+=Number(rec.amount)||fee;
    const startYm=s.start?ymOf(s.start):(s.createdAt?ymOf(s.createdAt):null);
    if(fee>0&&s.active!==false&&s.plan!=='pacote'&&!(startYm&&thisYm<startYm))exp+=fee;
  }
  for(const p of Object.values(S.data.packs)){
    if(p&&(p.at||'').slice(0,7)===thisYm){got+=Number(p.value)||0;packSales+=Number(p.value)||0}
  }

}

/* ---------- pacotes de aulas ---------- */
const studentPacks=sid=>Object.entries(S.data.packs)
  .map(([id,p])=>({id,...p})).filter(p=>p.sid===sid)
  .sort((a,b)=>String(a.at).localeCompare(String(b.at)));
/* O saldo é contado por CICLO: packStart marca o início do ciclo atual; só os
   pacotes vendidos a partir dele somam créditos, e só as presenças "ok" a partir
   dele contam como uso. Lançar um pacote com o saldo zerado inicia um novo ciclo
   (packStart avança), então presenças da época de mensalidade não consomem o
   pacote novo. */
function packCycleStart(sid){
  const s=stById(sid); if(!s)return null;
  if(s.packStart)return s.packStart;
  const first=studentPacks(sid)[0];
  return first?first.at:null;
}
function packUsed(sid){
  const start=packCycleStart(sid); if(!start)return 0;
  let n=0;
  for(const[id,doc]of Object.entries(S.data.attendance)){
    if(!id.startsWith(sid+'_')||!doc.marks)continue;
    for(const[k,v]of Object.entries(doc.marks))
      if(v.s==='ok'&&k.slice(0,10)>=start)n++;
  }
  return n;
}
function packInfo(sid){
  const start=packCycleStart(sid);
  const packs=studentPacks(sid);
  const credits=packs.filter(p=>!start||String(p.at)>=start).reduce((a,p)=>a+(Number(p.qty)||0),0);
  const hasOld=!!start&&packs.some(p=>String(p.at)<start);
  const used=packUsed(sid);
  return{credits,used,left:credits-used,start,hasOld};
}
function packAlerts(){
  const warn=Number(settings().packWarn)||3, out=[];
  for(const s of activeStudents()){
    if(s.plan!=='pacote')continue;
    const pi=packInfo(s.id);
    if(pi.credits===0)out.push({s,left:0,none:true});
    else if(pi.left<=0)out.push({s,left:pi.left,out:true});
    else if(pi.left<=warn)out.push({s,left:pi.left});
  }
  return out.sort((a,b)=>a.left-b.left);
}

  doc.items=doc.items||{};

function delExpense(docId,id){
  const doc=clone(S.data.expenses[docId]); if(!doc||!doc.items)return;
  delete doc.items[id];
  putDoc('expenses',docId,doc);
}
function monthExpenses(ym){
  const doc=S.data.expenses[ym], out=[];
  if(doc&&doc.items)for(const[id,it]of Object.entries(doc.items))out.push({id,docId:ym,...it});
  return out.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
}
function expTotal(ym){ return monthExpenses(ym).reduce((a,e)=>a+(Number(e.v)||0),0); }
function expByCat(ym){
  const o={};
  for(const e of monthExpenses(ym))o[e.cat||'Outros']=(o[e.cat||'Outros']||0)+(Number(e.v)||0);
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function revByMethod(y,m){
  const o={}, thisYm=y+'-'+pad(m);
  for(const s of students()){
    const rec=(payDoc(s.id,y).months||{})[String(m)];
    if(rec){const k=rec.via||'Não informado';o[k]=(o[k]||0)+(Number(rec.amount)||Number(s.fee)||0)}
  }
  for(const p of Object.values(S.data.packs))
    if(p&&(p.at||'').slice(0,7)===thisYm){const k=p.via||'Não informado';o[k]=(o[k]||0)+(Number(p.value)||0)}
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function gymRepasse(y,m){
  const st=settings(), thisYm=y+'-'+pad(m), out=[];
  for(const g of st.gyms||[]){
    let total=0, n=0;
    for(const s of students()){
      if(s.gymId!==g.id)continue;
      const rec=(payDoc(s.id,y).months||{})[String(m)];
      let received=rec?(Number(rec.amount)||Number(s.fee)||0):0;
      for(const p of studentPacks(s.id))if((p.at||'').slice(0,7)===thisYm)received+=Number(p.value)||0;
      if(received>0){n++; total+=g.kind==='pct'?received*(Number(g.rate)||0)/100:(Number(g.rate)||0)}
    }
    if(n>0||total>0)out.push({g,total,n});
  }
  return out;
}

let SW=null;
function initSW(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').then(r=>{SW=r}).catch(()=>{});
    }
  }catch(e){}
}
function canNotify(){ return 'Notification' in window; }
function notify(title,body){
  toast(title+(body?' — '+body:''),'warn');
  try{ if(navigator.vibrate)navigator.vibrate([160,80,160]); }catch(e){}
  try{
    if(!canNotify()||Notification.permission!=='granted')return;
    /* Android Chrome só aceita notificação via Service Worker; desktop aceita o construtor */
    if(SW&&SW.showNotification){SW.showNotification(title,{body,tag:'prancheta'});return}
    try{new Notification(title,{body})}catch(e2){}
  }catch(e){}
}
const firedKey='prancheta-fired-v1';
function firedMap(){ try{return JSON.parse(localStorage.getItem(firedKey)||'{}')}catch(e){return{}} }
function markFired(k){
  try{
    const m=firedMap(); m[k]=Date.now();
    const cut=Date.now()-2*86400000;
    for(const kk of Object.keys(m))if(m[kk]<cut)delete m[kk];
    localStorage.setItem(firedKey,JSON.stringify(m));
  }catch(e){}
}
function reminderTick(){
  if(S.mode!=='app'||!S.data.profile)return;
  const now=new Date(), fired=firedMap();
  const lead=Number(settings().remindMin)||0;
  if(lead>0){
    const iso=todayISO(), nowMin=now.getHours()*60+now.getMinutes();
    for(const it of daySessions(iso).list){
      const diff=toMin(it.time)-nowMin;
      if(diff>0&&diff<=lead){
        const k='s|'+iso+'|'+it.time+'|'+it.sid;
        if(fired[k])continue;
        const s=stById(it.sid); if(!s)continue;
        markFired(k);
        notify('Treino em '+diff+' min','' +s.name+' às '+it.time);
      }
    }
  }
  for(const[id,r]of Object.entries(S.data.reminders)){
    if(!r||r.done||r.fired)continue;
    const at=new Date(r.at);
    if(at<=now){
      const k='r|'+id;
      if(fired[k])continue;
      markFired(k);
      putDoc('reminders',id,{...r,fired:true});
      notify('Lembrete',r.text);
    }
  }
}
setInterval(reminderTick,30000);

/* ---------- fotos ---------- */
function pickPhoto(cb){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const SZ=144, cv=document.createElement('canvas');
        cv.width=SZ; cv.height=SZ;
        const cx=cv.getContext('2d');
        const r=Math.max(SZ/img.width,SZ/img.height);
        const w=img.width*r, h=img.height*r;
        cx.drawImage(img,(SZ-w)/2,(SZ-h)/2,w,h);
        let q=0.82, url=cv.toDataURL('image/jpeg',q);
        while(url.length>26000&&q>0.4){q-=0.12;url=cv.toDataURL('image/jpeg',q)}
        cb(url);
      };
      img.onerror=()=>toast('Não foi possível ler essa imagem.','warn');
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  inp.click();
}

  for(let m=5*60;m<=23*60;m+=30){const t=toHM(m);o+=`<option value="${t}" ${t===sel?'selected':''}>${t}</option>`}
  return o;
}
async function obFinish(){
  const ob=S.ob;
  const salt=uid('s');
  const hash=await hashPw(ob.pw,salt);
  putCfg('profile',{name:ob.name,cref:ob.cref,email:ob.email,hash,salt,hint:ob.hint,createdAt:todayISO()});

/* ================= render dispatch ================= */
function renderMain(){
  applyTheme(settings().theme);
  const v=S.ui.view; let html='', fab='';
  if(v==='hoje')html=vHoje();
  else if(v==='agenda'){html=vAgenda();fab=`<button class="fab" data-a="extra-new" aria-label="Sessão avulsa">${I.plus}</button>`}
  else if(v==='alunos'){html=vAlunos();fab=`<button class="fab" data-a="stu-new" aria-label="Novo aluno">${I.plus}</button>`}
  else if(v==='aluno')html=vAluno();
  else if(v==='fin')html=vFin();
  else html=vMais();
  $('#main').innerHTML=html+fab;
  renderChrome();
  afterRender(v);
}

function greet(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function vHoje(){

  for(const wiso of wk){const dd=daySessions(wiso).list;wkTotal+=dd.length;dd.forEach(it=>{const mm=getMark(it.sid,wiso,it.time);if(mm&&mm.s==='ok')wkDone++})}

      <h1>${greet()}, ${esc(firstName(S.data.profile.name))} 👋</h1>

    <button class="btn sm ghost" data-a="stu-new">${I.plus} Aluno</button></div>

  ${packAlerts().slice(0,3).map(a=>`<button class="banner warnb" style="margin-bottom:12px;width:100%;text-align:left;cursor:pointer" data-a="stu" data-sid="${a.s.id}"><span style="flex:none">📦</span><span class="grow">${
    a.none?`<b>${esc(a.s.name)}</b> está sem pacote de aulas ativo.`
    :a.out?`<b>${esc(a.s.name)}</b> está com o pacote esgotado${a.left<0?' ('+(-a.left)+' aula(s) além do saldo)':''} — hora de renovar!`
    :`<b>${esc(a.s.name)}</b> tem só <b>${a.left}</b> aula(s) restantes no pacote.`}</span></button>`).join('')}
  <div class="tiles">
    <div class="tile"><div class="l">Sessões hoje</div><div class="v big-num">${list.length}</div><div class="d">${done} concluída${done===1?'':'s'}</div></div>
    <div class="tile"><div class="l">Esta semana</div><div class="v big-num">${wkTotal}</div><div class="d">${wkDone} concluída${wkDone===1?'':'s'}</div></div>
    <div class="tile"><div class="l">Alunos ativos</div><div class="v big-num">${activeStudents().length}</div><div class="d">${students().length-activeStudents().length} pausado(s)</div></div>
    <div class="tile"><div class="l">Ocupação semanal</div><div class="v big-num">${occ.pct}%</div><div class="bar" style="margin-top:7px"><i class="acc" style="width:${occ.pct}%"></i></div></div>
    <div class="tile"><div class="l">Recebido no mês</div><div class="v big-num" style="font-size:19px;padding-top:5px">${brl(rev.got)}</div><div class="d">de ${brl(rev.exp)} previstos</div></div>
  </div>

    ${upcoming.map(s=>`<div class="row" style="padding:7px 0"><span style="width:22px">🎂</span><span class="grow" style="font-weight:600">${esc(s.name)}</span><span class="muted small mono">${pad(s.bday)}/${pad(t.getMonth()+1)}</span></div>`).join('')}

function remindersHTML(){
  const now=new Date();
  const list=Object.entries(S.data.reminders).map(([id,r])=>({id,...r}))
    .filter(r=>!r.done).sort((a,b)=>String(a.at).localeCompare(String(b.at))).slice(0,5);
  const needPerm=canNotify()&&Notification.permission==='default'&&(Number(settings().remindMin)>0||list.length);
  const perm=needPerm?`<button class="banner" style="width:100%;text-align:left;cursor:pointer;margin-bottom:9px" data-a="notif-ask">${I.bell.replace('<svg','<svg width="17" height="17"')} Ativar notificações neste aparelho</button>`:'';
  if(!list.length)return perm+`<p class="small muted">Sem lembretes pendentes. Os treinos avisam ${Number(settings().remindMin)>0?settings().remindMin+' min antes':'— ative a antecedência em Mais'} com o app aberto.</p>`;
  return perm+`<div class="card" style="padding:6px 14px">${list.map((r,i)=>{
    const d2=new Date(r.at), late=d2<=now;
    return`<div class="row" style="padding:8px 0;${i<list.length-1?'border-bottom:1px solid var(--line)':''}">
      <span class="pill ${late?'warn':'mut'} mono" style="flex:none">${pad(d2.getDate())}/${pad(d2.getMonth()+1)} ${pad(d2.getHours())}:${pad(d2.getMinutes())}</span>
      <span class="grow" style="font-size:13.5px;font-weight:600">${esc(r.text)}</span>

    </div>`}).join('')}

}

/* ================= AGENDA ================= */
function weekOf(iso){
  const d=dateOf(iso), off=(d.getDay()+6)%7;
  const mon=addDays(iso,-off);
  return Array.from({length:7},(_,i)=>addDays(mon,i));
}
function vAgenda(){
  const sel=S.ui.selDate, wk=weekOf(sel), today=todayISO();
  const a=dateOf(wk[0]), b=dateOf(wk[6]);
  const ttl=a.getMonth()===b.getMonth()
    ?`${a.getDate()}–${b.getDate()} de ${MON[a.getMonth()]}`
    :`${a.getDate()} ${MONS[a.getMonth()]} – ${b.getDate()} ${MONS[b.getMonth()]}`;
  const chips=wk.map(iso=>{
    const d=dateOf(iso), n=daySessions(iso).list.length, on=settings().days[d.getDay()].on;
    return `<button class="daychip ${iso===sel?'sel':''} ${iso===today?'today':''} ${on||n?'':'off'}" data-a="sel-day" data-iso="${iso}">
      <span class="w">${WDS[d.getDay()]}</span><span class="n">${d.getDate()}</span>
      <span class="dots">${Array.from({length:Math.min(n,3)},()=>'<i></i>').join('')}</span></button>`;
  }).join('');
  return `<div class="hd"><div><h1>Agenda</h1><div class="sub">${S.cloud?'Sincronizada em todos os seus aparelhos':'Salva neste aparelho'}</div></div>
    <button class="btn sm ghost" data-a="extra-new">${I.plus} Sessão avulsa</button></div>
  <div class="wknav">
    <button class="icon-btn" data-a="wk-nav" data-n="-7" aria-label="Semana anterior">${I.chl}</button>
    <div class="ttl">${ttl}</div>
    <button class="btn sm soft" data-a="wk-today">Hoje</button>
    <button class="icon-btn" data-a="wk-nav" data-n="7" aria-label="Próxima semana">${I.chr}</button>
  </div>
  <div class="daychips">${chips}</div>
  <div class="only-m">${dayTimeline(sel)}</div>
  <div class="only-d">${weekGridHTML(wk)}</div>`;
}
function dayTimeline(iso){
  const{list,cancelled}=daySessions(iso);
  const wd=dateOf(iso).getDay(), on=settings().days[wd].on;
  let h=`<div class="eyebrow" style="margin-bottom:9px;text-transform:none">${esc(fmtLong(iso))}${on?'':' · <span style="color:var(--warn)">dia sem atendimento</span>'}</div>`;
  if(!list.length&&!cancelled.length)
    return h+`<div class="empty">${I.cal}<div class="big">${on?'Nenhum treino neste dia':'Você não atende neste dia'}</div>${on?'Os horários estão livres.':'Ative-o em Mais → Dias de atuação.'}</div>`;
  return h+`<div class="lst">${list.map(it=>sessCard(iso,it)).join('')}${cancelled.map(it=>sessCancelCard(iso,it)).join('')}</div>`;
}
function weekGridHTML(wk){
  const st=settings(), today=todayISO();
  const days=wk.map(iso=>{
    const wd=dateOf(iso).getDay();
    return{iso,wd,on:st.days[wd].on,data:daySessions(iso)};
  }).filter(d=>d.on||d.data.list.length||d.data.cancelled.length);
  if(!days.length)return`<div class="empty">${I.cal}<div class="big">Nenhum dia de atendimento</div>Ative seus dias em Mais → Dias de atuação.</div>`;
  let lo=24*60, hi=0;
  for(const d of days){
    if(d.on){lo=Math.min(lo,toMin(st.days[d.wd].start));hi=Math.max(hi,toMin(st.days[d.wd].end))}
    for(const it of d.data.list.concat(d.data.cancelled)){lo=Math.min(lo,toMin(it.time));hi=Math.max(hi,toMin(it.time)+it.dur)}
  }
  lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60;
  const ppm=66/60, H=(hi-lo)*ppm;
  const cols='56px '+days.map(()=>'1fr').join(' ');
  const head=`<div class="wg-head" style="grid-template-columns:${cols}"><div class="gc"></div>${days.map(d=>{
    const dt=dateOf(d.iso);
    return`<div class="gc ${d.iso===today?'today':''}" role="button" data-a="sel-day" data-iso="${d.iso}" style="cursor:pointer"><span class="w">${WDS[d.wd]}</span><br><span class="n mono">${pad(dt.getDate())}</span></div>`;
  }).join('')}</div>`;
  let gutter='';
  for(let m=lo;m<=hi;m+=60)gutter+=`<div class="h" style="top:${(m-lo)*ppm}px">${toHM(m)}</div>`;
  const body=`<div class="wg-body" style="grid-template-columns:${cols};height:${H}px">
    <div class="wg-gutter">${gutter}</div>
    ${days.map(d=>{
      const cfg=st.days[d.wd];
      const blocks=d.data.list.map(it=>{
        const s=stById(it.sid); if(!s)return'';
        const top=(toMin(it.time)-lo)*ppm, h2=Math.max(20,it.dur*ppm-3);
        const fl=it.kind==='extra'?'AV':it.kind==='moved'?'RM':'';
        return`<button class="blk" style="top:${top}px;height:${h2}px;background:${s.color||COLORS[6]}"
          title="${esc(s.name)} · ${it.time}${it.w?' · '+esc(it.w):''}"
          data-a="sess-sheet" data-iso="${d.iso}" data-sid="${it.sid}" data-time="${it.time}" data-kind="${it.kind}">
          ${fl?`<span class="fl">${fl}</span>`:''}<span class="t">${it.time}${it.w?' · '+esc(it.w):''}</span><span class="n">${esc(s.name)}</span></button>`;
      }).join('')+d.data.cancelled.map(it=>{
        const s=stById(it.sid); if(!s)return'';
        const top=(toMin(it.time)-lo)*ppm, h2=Math.max(20,it.dur*ppm-3);
        return`<button class="blk cnc" style="top:${top}px;height:${h2}px" title="Sessão cancelada — clique para restaurar"
          data-a="exc-restore" data-doc="${it.exc.docId}" data-id="${it.exc.id}">
          <span class="t">${it.time}</span><span class="n">${esc(s.name)}</span></button>`;
      }).join('');
      let shade='';
      if(cfg.on){
        const s0=(toMin(cfg.start)-lo)*ppm,s1=(toMin(cfg.end)-lo)*ppm;
        if(s0>0)shade+=`<div style="position:absolute;left:0;right:0;top:0;height:${s0}px;background:color-mix(in srgb,var(--surface2) 55%,transparent)"></div>`;
        if(s1<H)shade+=`<div style="position:absolute;left:0;right:0;top:${s1}px;bottom:0;background:color-mix(in srgb,var(--surface2) 55%,transparent)"></div>`;
      }
      return`<div class="wg-col ${cfg.on?'':'off'}">${shade}${blocks}</div>`;
    }).join('')}
  </div>`;
  return`<div class="wg"><div class="wg-in">${head}${body}</div></div>`;
}

    <div class="m-head"><h2>Remarcar sessão</h2><button class="icon-btn" data-a="layer-close">${I.x}</button></div>
    <div class="m-body">
      <p class="small muted" style="margin-bottom:12px">${esc(s.name)} · ${fmtDM(iso)} às ${time}. Escolha a nova data e horário — conflitos são bloqueados automaticamente.</p>

    </div>
    <div class="m-foot"><button class="btn soft" data-a="layer-close">Cancelar</button><button class="btn" id="${id}-ok">Remarcar</button></div>
  </div>`);
  const dEl=$('#'+id+'-d'), tEl=$('#'+id+'-t'), hEl=$('#'+id+'-h');
  const skip={sid,time:it.time,kind:it.kind,date:iso};
  const fill=()=>{
    const niso=dEl.value; if(!niso){tEl.innerHTML='';return}
    const wd=dateOf(niso).getDay(), cfg=settings().days[wd];
    const step=Number(settings().step)||60;
    const lo=cfg.on?toMin(cfg.start):6*60, hi=cfg.on?toMin(cfg.end):22*60;
    let o='';
    for(let m=lo;m+it.dur<=hi;m+=step){
      const c=conflictOnDate(niso,toHM(m),it.dur,skip);
      o+=`<option value="${toHM(m)}" ${c?'disabled':''}>${toHM(m)}${c?' — ocupado ('+esc((stById(c.sid)||{}).name||'')+')':''}</option>`;
    }
    tEl.innerHTML=o||'<option value="">Sem horários</option>';
    hEl.innerHTML=cfg.on?'':'<span style="color:var(--warn)">⚠ Fora dos seus dias de atuação — permitido como exceção.</span>';
  };
  fill(); dEl.addEventListener('change',fill);
  $('#'+id+'-ok').addEventListener('click',()=>{
    const nd=dEl.value, nt=tEl.value;
    if(!nd||!nt){$('#'+id+'-err').innerHTML='<div class="f"><div class="err">Escolha data e horário.</div></div>';return}
    const c=conflictOnDate(nd,nt,it.dur,skip);
    if(c){$('#'+id+'-err').innerHTML=`<div class="f"><div class="err">Conflito: ${esc((stById(c.sid)||{}).name||'outro aluno')} às ${c.time}.</div></div>`;return}
    if(kind==='reg')addExc({type:'move',date:iso,sid,time:it.time,toDate:nd,toTime:nt,w:it.w||''});
    else if(kind==='moved')updExc(it.exc,{toDate:nd,toTime:nt});
    else updExc(it.exc,{date:nd,time:nt});
    moveMark(sid,iso,it.time,nd,nt);
    closeAllLayers(); S.ui.selDate=nd; renderMain();
    toast('Sessão remarcada para '+fmtDM(nd)+' às '+nt+'.');
  });
}

function evalSectionHTML(s,entries){
  const avail=EVAL_METRICS.filter(([k])=>entries.filter(e2=>evalVal(e2,k)!=null).length>=2);
  let met=S.ui.evalMetric||'w';
  if(avail.length&&!avail.some(([k])=>k===met))met=avail[0][0];
  const last=entries.length?entries[entries.length-1]:null;
  const firstE=entries.length?entries[0]:null;
  const imc=last?imcOf(evalVal(last,'w'),s.height):null;
  const rcq=last&&Number(last.waist)>0&&Number(last.hip)>0?Number(last.waist)/Number(last.hip):null;
  const pace=last?paceOf(last.runDist,last.runTime):null;
  const goal=Number(s.goalWeight)||0;
  let goalPct=null;
  if(goal&&firstE&&last){
    const w0=evalVal(firstE,'w'),w1=evalVal(last,'w');
    if(w0&&w1&&w0!==goal)goalPct=Math.max(0,Math.min(100,Math.round((w0-w1)/(w0-goal)*100)));
  }
  const cmp=[];
  if(firstE&&last&&firstE!==last){
    for(const[k,l,u]of EVAL_METRICS){
      const a=evalVal(firstE,k),b=evalVal(last,k);
      if(a!=null&&b!=null)cmp.push({l,u,a,b,d:b-a,inv:k==='pace'});
    }
  }
  const fmtV=(v,u)=>u==='min/km'?fmtPace(v):v.toLocaleString('pt-BR',{maximumFractionDigits:1})+' '+u;
  const series=entries.map(e2=>({d:e2.d,v:evalVal(e2,met)})).filter(x=>x.v!=null);
  const mdef=EVAL_METRICS.find(m2=>m2[0]===met)||EVAL_METRICS[0];
  return `<div class="sec"><div class="row between" style="flex-wrap:wrap;gap:8px"><div class="eyebrow">Avaliações físicas</div>
    <button class="btn sm" data-a="eval-new" data-sid="${s.id}">${I.plus} Nova avaliação</button></div>
    <div class="card">
      ${last?`<div class="kv" style="margin-bottom:14px">
        ${evalVal(last,'w')!=null?`<div class="it"><div class="k">Peso</div><div class="v mono">${fmtV(evalVal(last,'w'),'kg')}</div></div>`:''}
        ${imc!=null?`<div class="it"><div class="k">IMC</div><div class="v mono">${imc.toFixed(1)}</div><div class="small muted">${imcClass(imc)}</div></div>`:''}
        ${evalVal(last,'mm')!=null?`<div class="it"><div class="k">Massa magra</div><div class="v mono">${fmtV(evalVal(last,'mm'),'kg')}</div></div>`:''}
        ${evalVal(last,'mg')!=null?`<div class="it"><div class="k">Massa gorda</div><div class="v mono">${fmtV(evalVal(last,'mg'),'kg')}</div></div>`:''}
        ${evalVal(last,'bf')!=null?`<div class="it"><div class="k">% Gordura</div><div class="v mono">${fmtV(evalVal(last,'bf'),'%')}</div></div>`:''}
        ${rcq!=null?`<div class="it"><div class="k">RCQ</div><div class="v mono">${rcq.toFixed(2)}</div><div class="small muted">cintura ÷ quadril</div></div>`:''}
        ${pace!=null?`<div class="it"><div class="k">Ritmo de corrida</div><div class="v mono">${fmtPace(pace)}</div><div class="small muted">${Number(last.runDist).toLocaleString('pt-BR')} km em ${last.runTime} min</div></div>`:''}
      </div>`:''}
      ${goalPct!==null?`<div style="margin-bottom:14px"><div class="row between small" style="margin-bottom:5px"><b>Meta: ${goal.toLocaleString('pt-BR')} kg</b><span class="muted mono">${goalPct}%</span></div><div class="bar"><i class="acc" style="width:${goalPct}%"></i></div></div>`:''}
      ${avail.length&&series.length>=2?`<div class="seg" style="margin-bottom:10px;flex-wrap:wrap">${avail.map(([k,l])=>`<button class="${met===k?'on':''}" data-a="eval-metric" data-m="${k}">${l}</button>`).join('')}</div>
        ${metricChart(series,mdef)}`:''}
      ${cmp.length?`<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:7px">Primeira × última avaliação</div>
        ${cmp.map(c=>`<div class="row small" style="padding:4px 0"><span style="width:92px;color:var(--ink2);font-weight:600">${c.l}</span>
          <span class="mono">${fmtV(c.a,c.u)} → <b>${fmtV(c.b,c.u)}</b></span>
          <span class="pill ${(c.inv?c.d<0:c.l==='M. magra'?c.d>0:c.d<0)?'ok':c.d===0?'mut':'warn'}" style="font-size:10px">${c.d>0?'+':''}${c.u==='min/km'?(c.d*60).toFixed(0)+'s/km':c.d.toLocaleString('pt-BR',{maximumFractionDigits:1})}</span>
        </div>`).join('')}</div>`:''}
      ${entries.length?`<div style="margin-top:12px">${entries.slice(-6).reverse().map(e2=>{
        const idx=entries.indexOf(e2);
        const bits=[];
        if(evalVal(e2,'w')!=null)bits.push(evalVal(e2,'w').toLocaleString('pt-BR')+' kg');
        if(evalVal(e2,'bf')!=null)bits.push(evalVal(e2,'bf').toLocaleString('pt-BR')+'% gord.');
        const pc=paceOf(e2.runDist,e2.runTime); if(pc!=null)bits.push(fmtPace(pc));
        return`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)">
          <span class="mono small" style="width:78px">${fmtDMY(e2.d)}</span>
          <span class="grow small"><b>${bits.join(' · ')||'—'}</b>${e2.note?'<span class="muted"> · '+esc(e2.note)+'</span>':''}</span>
          <button class="icon-btn" style="width:28px;height:28px" data-a="eval-del" data-sid="${s.id}" data-i="${idx}" title="Excluir">${I.x}</button>
        </div>`}).join('')}</div>`
      :'<p class="small muted">Registre peso, composição corporal, medidas e índice de corrida — a evolução aparece aqui em gráficos.</p>'}
    </div></div>`;
}
function metricChart(series,mdef){
  const pts=series.slice(-12);
  const vs=pts.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs);
  const pad2=(max-min)||1, W=560, H=64;
  const xy=pts.map((p,i)=>[pts.length===1?W/2:8+i*(W-16)/(pts.length-1),H-8-((p.v-min)/pad2)*(H-16)]);
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=xy[xy.length-1];
  const fmt=v=>mdef[2]==='min/km'?fmtPace(v):v.toLocaleString('pt-BR',{maximumFractionDigits:1});
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Evolução de ${mdef[1]}">
    <polygon class="ar" points="${xy[0][0]},${H} ${line} ${last[0]},${H}"/>
    <polyline points="${line}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>
  <div class="row between small muted mono"><span>${fmtDM(pts[0].d)}</span><span>${fmt(min)}–${fmt(max)} ${mdef[2]==='min/km'?'':mdef[2]}</span><span>${fmtDM(pts[pts.length-1].d)}</span></div>`;
}
function evalChart(entries){
  const pts=entries.slice(-12);
  const ws=pts.map(p=>p.w), min=Math.min(...ws), max=Math.max(...ws);
  const pad2=(max-min)||1, W=560, H=64;
  const xy=pts.map((p,i)=>[pts.length===1?W/2:8+i*(W-16)/(pts.length-1),H-8-((p.w-min)/pad2)*(H-16)]);
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=xy[xy.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Evolução de peso">
    <polygon class="ar" points="${xy[0][0]},${H} ${line.split(' ').join(' ')} ${last[0]},${H}"/>
    <polyline points="${line}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>
  <div class="row between small muted mono"><span>${fmtDM(pts[0].d)}</span><span>${min.toLocaleString('pt-BR')}–${max.toLocaleString('pt-BR')} kg</span><span>${fmtDM(pts[pts.length-1].d)}</span></div>`;
}

function saveStudent(){
  syncDraftFields();
  const d=S.draft, err=$('#sf-err');
  if(!d.name){err.innerHTML='<div class="f"><div class="err">Informe o nome do aluno.</div></div>';return}
  for(const sc of d.schedule){
    const c=conflictAt(sc.d,sc.t,draftDur(),d.id,null);
    if(c&&!c.self){err.innerHTML=`<div class="f"><div class="err">Conflito em ${WDS[sc.d]} ${sc.t} com ${esc(c.s.name)}. Ajuste os horários.</div></div>`;return}
  }
  for(let i=0;i<d.schedule.length;i++)for(let j=i+1;j<d.schedule.length;j++){
    const a=d.schedule[i],b=d.schedule[j];
    if(a.d===b.d&&ovl(toMin(a.t),draftDur(),toMin(b.t),draftDur())){
      err.innerHTML=`<div class="f"><div class="err">Dois horários deste aluno se sobrepõem: ${WDS[a.d]} ${a.t} e ${b.t} (sessão de ${draftDur()} min). Remova um deles.</div></div>`;return;
    }
  }
  const id=d.id||uid('a');
  const body={name:d.name,phone:d.phone,goal:d.goal,color:d.color,fee:d.fee===''?'':Number(d.fee),
    dueDay:d.dueDay,birth:d.birth,start:d.start,notes:d.notes,active:d.active!==false,
    dur:d.dur,schedule:d.schedule,createdAt:(d.createdAt||todayISO()),
    gender:d.gender||'',plan:d.plan||'mensal',gymId:d.gymId||'',photo:d.photo||'',
    packStart:d.packStart||'',height:d.height||'',goalWeight:d.goalWeight||''};
  putDoc('students',id,body);
  closeAllLayers();
  toast(d.id?'Aluno atualizado ✓':d.name.split(' ')[0]+' cadastrado(a) ✓');
  if(!d.id&&!d.schedule.length)toast('Dica: adicione horários fixos para o aluno aparecer na agenda.','warn');
  const w=d.schedule.flatMap(sc=>excConflictsForSlot(sc.d,sc.t,draftDur(),id));
  if(w.length)toast('Atenção: '+w[0].s.name+' tem sessão em '+fmtDM(w[0].date)+' às '+w[0].time+' que conflita com o novo horário fixo.','warn');
  go('aluno',{sid:id});
}
function deleteStudent(sid){
  const s=stById(sid); if(!s)return;
  confirmDlg({title:'Excluir aluno',danger:true,okLabel:'Excluir tudo',typed:'EXCLUIR',
    msg:`Excluir <b>${esc(s.name)}</b> apaga o cadastro, os horários, o histórico de presenças, pagamentos e avaliações. Essa ação não pode ser desfeita.`,
    onOk:()=>{
      delDoc('students',sid);
      for(const id of Object.keys(S.data.attendance))if(id.startsWith(sid+'_'))delDoc('attendance',id);
      for(const id of Object.keys(S.data.payments))if(id.startsWith(sid+'_'))delDoc('payments',id);
      for(const id of Object.keys(S.data.packs))if((S.data.packs[id]||{}).sid===sid)delDoc('packs',id);
      if(S.data.evals[sid])delDoc('evals',sid);
      for(const[docId,doc]of Object.entries(S.data.exceptions)){
        const items={...(doc.items||{})}; let ch=false;
        for(const[k,v]of Object.entries(items))if(v.sid===sid){delete items[k];ch=true}
        if(ch)putDoc('exceptions',docId,{...doc,items});
      }
      toast('Aluno excluído.');
      go('alunos');
    }});
}

function last6(y,m){
  const out=[];
  for(let i=5;i>=0;i--){
    let mm=m-i, yy=y;
    while(mm<1){mm+=12;yy--}
    out.push({y:yy,m:mm,ym:yy+'-'+pad(mm)});
  }
  return out;
}
function finRelatorio(y,m){

  const data=per.map(p=>{
    const r=monthRevenue(p.y,p.m);
    return{...p,rec:r.got,gas:expTotal(p.ym)};
  });
  const cur=data[data.length-1];
  const lucro=cur.rec-cur.gas;
  const methods=revByMethod(y,m);
  const cats=expByCat(y+'-'+pad(m));
  const reps=gymRepasse(y,m);
  const repTotal=reps.reduce((a,r)=>a+r.total,0);
  let aulas=0;

   for(const[idd,doc]of Object.entries(S.data.attendance)){

    <div class="tile"><div class="l">Lucro</div><div class="v big-num" style="font-size:17px;padding-top:6px;color:${lucro>=0?'var(--ok)':'var(--bad)'}">${brl(lucro)}</div></div>
    <div class="tile"><div class="l">Repasse devido</div><div class="v big-num" style="font-size:17px;padding-top:6px">${brl(repTotal)}</div></div>

    <div class="card">
      <div class="legend"><span><i style="background:var(--ch1)"></i>Receita</span><span><i style="background:var(--ch2)"></i>Gastos</span></div>
      <div class="gbars">${groupedBars(data)}</div>
    </div></div>
  <div class="sec"><div class="eyebrow">Receita por forma de recebimento — ${MONS[m-1]}</div>
    <div class="card">${methods.length?hbars(methods,false):'<p class="small muted">Nenhum recebimento registrado neste mês.</p>'}</div></div>
  <div class="sec"><div class="eyebrow">Gastos por categoria — ${MONS[m-1]}</div>
    <div class="card">${cats.length?hbars(cats,true):'<p class="small muted">Nenhum gasto lançado neste mês.</p>'}</div></div>`;
}
function groupedBars(data){
  const W=560,H=190,PB=26,PT=18,PL=8,PR=8;
  const max=Math.max(1,...data.map(d=>Math.max(d.rec,d.gas)));
  const gw=(W-PL-PR)/data.length, bw=Math.min(26,(gw-14)/2);
  const yOf=v=>PT+(H-PB-PT)*(1-v/max);
  const short=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(Math.round(v));
  let bars='';
  data.forEach((d,i)=>{
    const cx=PL+gw*i+gw/2;
    const x1=cx-bw-1, x2=cx+1;
    const h1=Math.max(d.rec>0?3:0,H-PB-yOf(d.rec)), h2=Math.max(d.gas>0?3:0,H-PB-yOf(d.gas));
    bars+=`<rect x="${x1.toFixed(1)}" y="${(H-PB-h1).toFixed(1)}" width="${bw.toFixed(1)}" height="${h1.toFixed(1)}" rx="4" fill="var(--ch1)"><title>${MONS[d.m-1]}: receita ${brl(d.rec)}</title></rect>`;
    bars+=`<rect x="${x2.toFixed(1)}" y="${(H-PB-h2).toFixed(1)}" width="${bw.toFixed(1)}" height="${h2.toFixed(1)}" rx="4" fill="var(--ch2)"><title>${MONS[d.m-1]}: gastos ${brl(d.gas)}</title></rect>`;
    if(i===data.length-1||d.rec===max)
      bars+=`<text x="${(x1+bw/2).toFixed(1)}" y="${(H-PB-h1-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink2)">${short(d.rec)}</text>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink2)">${MONS[d.m-1]}</text>`;
  });
  const grid=[0.5,1].map(f=>`<line x1="${PL}" x2="${W-PR}" y1="${yOf(max*f).toFixed(1)}" y2="${yOf(max*f).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e gastos por mês">
    ${grid}<line x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}" stroke="var(--line)" stroke-width="1"/>${bars}</svg>`;
}
function hbars(pairs,isExp){
  const max=Math.max(1,...pairs.map(p=>p[1]));
  return `<div class="hbars">${pairs.map(([k,v])=>`
    <div class="r" title="${esc(k)}: ${brl(v)}">
      <span class="lb">${esc(k)}</span>
      <span class="tr"><span class="fl ${isExp?'g':''}" style="width:${Math.max(2,Math.round(v/max*100))}%"></span></span>
      <span class="vl">${brl(v)}</span>
    </div>`).join('')}</div>`;
}

    if(!ps2||pi.credits===0||pi.left<=0){ if(ps2!==dt){ps2=dt;newCycle=!!body.packStart} }
    else if(dt<ps2)ps2=dt;
    if(ps2!==body.packStart){body.packStart=ps2;changed=true}
    const plEl=$('#'+id+'-pl');
    const wantPlan=s.plan==='pacote'||!plEl||plEl.checked;
    if(wantPlan&&body.plan!=='pacote'){body.plan='pacote';changed=true;planChanged=true}
    if(changed)putDoc('students',sid,body);
    if(via)setLM(via);
    closeAllLayers(); renderMain();
    toast('Pacote de '+qty+' aulas lançado ✓'+(newCycle?' Novo ciclo iniciado.':''));
    if(planChanged)toast('A cobrança de '+firstName(s.name)+' agora é por pacote (sem mensalidade).','warn');
  });
}

async function exportCSV(y,m){
  const ym=y+'-'+pad(m);
  const sep=';', lines=['tipo'+sep+'data'+sep+'descricao'+sep+'categoria/forma'+sep+'valor'];
  const csvNum=v=>String((Number(v)||0).toFixed(2)).replace('.',',');
  const q=s2=>'"'+String(s2||'').replace(/"/g,'""')+'"';
  for(const s of students()){
    const rec=(payDoc(s.id,y).months||{})[String(m)];
    if(rec)lines.push(['receita',rec.at,q('Mensalidade '+s.name),q(rec.via||''),csvNum(rec.amount||s.fee)].join(sep));
  }
  for(const p of Object.values(S.data.packs))
    if((p.at||'').slice(0,7)===ym){const s=stById(p.sid);lines.push(['receita',p.at,q('Pacote '+(p.qty)+' aulas '+(s?s.name:'')),q(p.via||''),csvNum(p.value)].join(sep))}
  for(const e2 of monthExpenses(ym))
    lines.push(['gasto',e2.d,q(e2.note||e2.cat),q(e2.cat),csvNum(-(Number(e2.v)||0))].join(sep));
  const csv='﻿'+lines.join('\r\n');
  let dl=null;
  try{ if(window.claude&&window.claude.use)dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:'prancheta-financeiro-'+ym+'.csv',data:csv}); toast('CSV exportado ✓'); return; }
    catch(e){ if(e&&(e.code==='declined'||e.code==='rate_limited'))return; }
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='prancheta-financeiro-'+ym+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSV baixado ✓');
  }catch(e){
    try{await navigator.clipboard.writeText(csv);toast('CSV copiado para a área de transferência ✓')}catch(e2){toast('Não foi possível exportar.','bad')}
  }
}

async function exportData(){
  const payload=JSON.stringify({app:'prancheta',v:2,at:new Date().toISOString(),
    profile:S.data.profile,settings:S.data.settings,
    ...Object.fromEntries(COLLS.map(c=>[c,S.data[c]]))},null,2);
  let dl=null;
  try{ if(window.claude&&window.claude.use)dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:'prancheta-backup-'+todayISO()+'.json',data:payload}); toast('Backup salvo ✓'); return; }
    catch(e){ if(e&&(e.code==='declined'||e.code==='rate_limited'))return; }
  }
  const id=uid('xp');
  openLayer(`<div class="modal" role="dialog">
    <div class="m-head"><h2>Exportar backup</h2><button class="icon-btn" data-a="layer-close">${I.x}</button></div>
    <div class="m-body"><p class="small muted" style="margin-bottom:10px">Copie o conteúdo abaixo e guarde em um lugar seguro.</p>
      <div class="f"><textarea id="${id}-t" style="min-height:180px;font-size:11px;font-family:ui-monospace,monospace" readonly>${esc(payload)}</textarea></div>
    </div>
    <div class="m-foot"><button class="btn soft" data-a="layer-close">Fechar</button><button class="btn" id="${id}-c">Copiar</button></div>
  </div>`);
  $('#'+id+'-c').addEventListener('click',async()=>{
    const ta=$('#'+id+'-t');
    try{await navigator.clipboard.writeText(ta.value);toast('Copiado ✓')}
    catch(e){ta.select();document.execCommand('copy');toast('Copiado ✓')}
  });
}
function openImport(){
  const id=uid('im');
  openLayer(`<div class="modal" role="dialog">
    <div class="m-head"><h2>Importar backup</h2><button class="icon-btn" data-a="layer-close">${I.x}</button></div>
    <div class="m-body"><p class="small muted" style="margin-bottom:10px">Cole aqui o conteúdo de um backup exportado pela Prancheta. <b>Isso substitui todos os dados atuais.</b></p>
      <div class="f"><textarea id="${id}-t" style="min-height:160px;font-size:11px;font-family:ui-monospace,monospace" placeholder='{"app":"prancheta", …}'></textarea></div>
      <div id="${id}-err"></div>
    </div>
    <div class="m-foot"><button class="btn soft" data-a="layer-close">Cancelar</button><button class="btn danger" id="${id}-ok">Importar e substituir</button></div>
  </div>`);
  $('#'+id+'-ok').addEventListener('click',()=>{
    const err=$('#'+id+'-err'), okBtn=$('#'+id+'-ok');
    let d;
    try{d=JSON.parse($('#'+id+'-t').value)}catch(e){err.innerHTML='<div class="f"><div class="err">JSON inválido — cole o arquivo completo.</div></div>';return}
    if(!d||d.app!=='prancheta'||!d.profile){err.innerHTML='<div class="f"><div class="err">Este conteúdo não parece um backup da Prancheta.</div></div>';return}
    confirmDlg({title:'Substituir todos os dados?',danger:true,okLabel:'Importar',
      msg:'Os dados atuais serão apagados e substituídos pelo backup. Confirmar?',
      onOk:async()=>{
        okBtn.disabled=true; okBtn.textContent='Importando…';
        let fails=0;
        for(const coll of COLLS){
          const inc=d[coll]||{};
          for(const idx of Object.keys({...S.data[coll]}))
            if(!inc[idx]){try{await delDocAwait(coll,idx)}catch(e){fails++}}
          for(const[idx,body]of Object.entries(inc)){try{await putDocAwait(coll,idx,body)}catch(e){fails++}}
        }
        persistLocal();
        putCfg('profile',d.profile);
        if(d.settings)putCfg('settings',d.settings);
        const keep=(()=>{try{return localStorage.getItem(KKEY)!=='0'}catch(e){return true}})();
        if(d.profile.hash)setToken(d.profile.hash,keep);
        closeAllLayers(); renderMain();
        if(fails)toast('Importação concluída com '+fails+' falha(s) — repita a importação para completar.','warn');
        else toast('Backup importado ✓');
      }});
  });
}
function wipeAll(){
  confirmDlg({title:'Apagar todos os dados',danger:true,okLabel:'Apagar tudo',typed:'APAGAR',
    msg:'Isso remove <b>todos</b> os alunos, horários, presenças, pagamentos e o seu cadastro. Não há como desfazer. Considere exportar um backup antes.',
    onOk:()=>{
      for(const coll of COLLS)
        for(const id of Object.keys(S.data[coll]))delDoc(coll,id);
      delCfg('profile'); delCfg('settings');
      clearToken();
      try{localStorage.removeItem(KEY)}catch(e){}
      S.data={profile:null,settings:null,...Object.fromEntries(COLLS.map(c=>[c,{}]))};
      closeAllLayers();
      $('#app').classList.remove('on');
      toast('Dados apagados.');
      route();
    }});

function packWarnToast(sid){
  const s=stById(sid);
  if(!s||s.plan!=='pacote')return;
  const pi=packInfo(sid), warn=Number(settings().packWarn)||3;
  if(pi.credits===0)toast('📦 '+firstName(s.name)+' está sem pacote ativo — lance um pacote no perfil.','warn');
  else if(pi.left<=0)toast('📦 O pacote de '+firstName(s.name)+' acabou — hora de renovar!','warn');
  else if(pi.left<=warn)toast('📦 Restam '+pi.left+' aula(s) no pacote de '+firstName(s.name)+'.','warn');
}

  'lk-enter':async()=>{
    const p=S.data.profile, pw=$('#lk-pw').value, keep=$('#lk-keep').checked;
    if(await hashPw(pw,p.salt)===p.hash){ setToken(p.hash,keep); enterApp(); toast(greet()+', '+firstName(p.name)+'!'); }
    else $('#lk-err').innerHTML='<div class="f"><div class="err">Senha incorreta.</div></div>';
  },
  'lk-forgot':()=>{
    const p=S.data.profile;
    openLayer(`<div class="modal" role="dialog"><div class="m-head"><h2>Esqueci a senha</h2><button class="icon-btn" data-a="layer-close">${I.x}</button></div>
      <div class="m-body"><p style="font-size:14px">${p.hint?'Sua dica de senha é:<br><br><b style="font-size:17px">“'+esc(p.hint)+'”</b>':'Você não cadastrou uma dica de senha.'}</p>
      <p class="small muted" style="margin-top:12px">Sem a senha não é possível abrir os dados deste link. Se tiver um backup exportado, você pode recomeçar do zero e importá-lo depois do novo cadastro.</p>
      <button class="btn danger ghost wide" data-a="wipe" style="margin-top:14px">Apagar tudo e recomeçar</button></div>
      <div class="m-foot"><button class="btn" data-a="layer-close">Entendi</button></div></div>`);
  },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const fn=A[el.dataset.a];
  if(fn){e.preventDefault();fn(el)}
});

/* onboarding day rows change (delegated) */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.a==='ob-day'){const d=Number(t.dataset.d);S.ob.days[d].on=t.checked;t.closest('.dayrow').classList.toggle('offd',!t.checked)}
  if(t.dataset&&t.dataset.a==='ob-start')S.ob.days[Number(t.dataset.d)].start=t.value;
  if(t.dataset&&t.dataset.a==='ob-end')S.ob.days[Number(t.dataset.d)].end=t.value;
});

</script>
</body>
</html>
